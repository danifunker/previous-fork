name: Build and release

# Releases: either push a tag (e.g. r1862-1), or use "Run workflow" on the
# Actions tab and fill in "release_tag" - the run then creates that tag on
# the selected branch and publishes the release. With "release_tag" empty
# a manual run only builds; the archives are attached to the run.
#
# macOS: every run signs the app with the Developer ID certificate and has
# it notarized by Apple (MACOS_* secrets, see README.md). A run without
# those secrets, or whose notarization isn't accepted, fails - there are no
# ad-hoc signed builds.
on:
  push:
    tags: ['r*', 'v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (e.g. r1862-1); empty = build only
        type: string
        default: ""

permissions:
  contents: write

env:
  SDL3_VERSION: 3.2.0

jobs:
  macos:
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.notarize.outputs.notarized }}
    steps:
      # fail early, before building, when signing or notarization can't work
      - name: Check signing secrets
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' }}
          HAS_API_KEY: ${{ secrets.MACOS_NOTARIZE_API_KEY != '' && secrets.MACOS_NOTARIZE_API_KEY_ID != '' && secrets.MACOS_NOTARIZE_API_ISSUER != '' }}
          HAS_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID != '' && secrets.MACOS_NOTARIZE_PASSWORD != '' && secrets.MACOS_TEAM_ID != '' }}
        run: |
          [ "$HAS_CERT" = true ] ||
            { echo "::error::MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD missing: every build must be signed and notarized (see README.md)"; exit 1; }
          [ "$HAS_API_KEY" = true ] || [ "$HAS_APPLE_ID" = true ] ||
            { echo "::error::notarization credentials missing: MACOS_NOTARIZE_API_KEY/_KEY_ID/_ISSUER or MACOS_NOTARIZE_APPLE_ID/_PASSWORD + MACOS_TEAM_ID (see README.md)"; exit 1; }
          echo "macOS: Developer ID signing and notarization"

      - uses: actions/checkout@v7

      - name: Build SDL3 (universal, shared)
        run: |
          curl -sSL -o sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz
          tar xzf sdl.tgz
          cmake -S SDL3-$SDL3_VERSION -B sdl-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DCMAKE_INSTALL_PREFIX=$HOME/sdl3
          cmake --build sdl-build -j3
          cmake --install sdl-build

      - name: Build Previous
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$HOME/sdl3 \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=ON -DCMAKE_DISABLE_FIND_PACKAGE_Readline=ON
          cmake --build build -j3

      - name: Make the app bundle self-contained
        run: |
          app=build/src/Previous.app
          fw=$app/Contents/Frameworks
          rm -rf "$fw" && mkdir -p "$fw"
          cp $HOME/sdl3/lib/libSDL3.0.dylib "$fw/"
          # point the executable at the bundled SDL
          old=$(otool -L $app/Contents/MacOS/Previous | awk '/libSDL3/ {print $1}')
          [ "$old" = "@rpath/libSDL3.0.dylib" ] || install_name_tool -change "$old" @rpath/libSDL3.0.dylib $app/Contents/MacOS/Previous
          otool -L $app/Contents/MacOS/Previous
          lipo -info $app/Contents/MacOS/Previous
          ! otool -L $app/Contents/MacOS/Previous | grep -E "/opt/homebrew|/usr/local"
          # stage everything that gets signed
          mkdir -p dist-mac
          cp -R $app dist-mac/
          cp build/src/ditool/ditool dist-mac/

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f $RUNNER_TEMP/cert.p12
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Sign
        id: sign
        run: |
          app=dist-mac/Previous.app
          [ -n "${SIGN_IDENTITY:-}" ] || { echo "::error::no signing identity"; exit 1; }
          echo "signing with: $SIGN_IDENTITY"
          opts="--force --timestamp --options runtime -s"
          # inner code first, the app last (no --deep)
          codesign $opts "$SIGN_IDENTITY" $app/Contents/Frameworks/libSDL3.0.dylib
          codesign $opts "$SIGN_IDENTITY" dist-mac/ditool
          codesign $opts "$SIGN_IDENTITY" --entitlements macos/previous.entitlements $app
          codesign --verify --strict --verbose=2 $app
          codesign --verify --strict --verbose=2 dist-mac/ditool

      - name: Notarize
        id: notarize
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          APPLE_PWD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          API_KEY: ${{ secrets.MACOS_NOTARIZE_API_KEY }}
          API_KEY_ID: ${{ secrets.MACOS_NOTARIZE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.MACOS_NOTARIZE_API_ISSUER }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          # App Store Connect API key if configured, else Apple ID + app-specific password
          if [ -n "$API_KEY" ]; then
            printf '%s' "$API_KEY" | base64 --decode > $RUNNER_TEMP/AuthKey.p8
            set -- --key $RUNNER_TEMP/AuthKey.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
          elif [ -n "$APPLE_ID" ]; then
            set -- --apple-id "$APPLE_ID" --password "$APPLE_PWD" --team-id "$TEAM_ID"
          else
            echo "::error::no notarization credentials"; exit 1
          fi
          # the app and ditool go to Apple together; the ticket is stapled
          # to the app (a bare executable can't hold one, Gatekeeper looks
          # it up online)
          ditto -c -k --keepParent dist-mac notarize.zip
          set +e
          out=$(xcrun notarytool submit notarize.zip "$@" --wait --timeout 30m 2>&1)
          r=$?
          set -e
          rm -f $RUNNER_TEMP/AuthKey.p8
          echo "$out"
          id=$(echo "$out" | awk '/^ *id:/ {print $2; exit}')
          if [ $r -ne 0 ] || ! echo "$out" | grep -q "status: Accepted"; then
            if [ -n "$id" ]; then
              [ -z "$API_KEY" ] || printf '%s' "$API_KEY" | base64 --decode > $RUNNER_TEMP/AuthKey.p8
              xcrun notarytool log "$id" "$@" || true
              rm -f $RUNNER_TEMP/AuthKey.p8
            fi
            exit 1
          fi
          xcrun stapler staple dist-mac/Previous.app
          xcrun stapler validate dist-mac/Previous.app
          spctl --assess --type execute --verbose dist-mac/Previous.app
          echo "notarized=true" >> $GITHUB_OUTPUT

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          P=dist-mac/Previous.app/Contents/MacOS/Previous
          set +e
          $P --help >/dev/null; r=$?; echo "--help: $r"; [ $r -eq 1 ] || exit 1
          $P --dialogs off --sound off --timeout 5 >/dev/null 2>&1; r=$?; echo "--timeout: $r"; [ $r -eq 124 ] || exit 1
          (sleep 5; touch done) & $P --dialogs off --sound off --exit-when done --timeout 60 >/dev/null 2>&1; r=$?
          echo "--exit-when: $r"; [ $r -eq 0 ] || exit 1

      - name: Package
        run: |
          d=previous-macos-universal
          mkdir $d
          ditto dist-mac/Previous.app $d/Previous.app
          cp dist-mac/ditool $d/
          cp README.md gpl.txt readme.previous.txt *.howto.txt $d/
          ditto -c -k --keepParent $d $d.zip

      - uses: actions/upload-artifact@v7
        with:
          path: previous-macos-universal.zip
          archive: false

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake zlib1g-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libdbus-1-dev libudev-dev

      - name: Build SDL3 (static)
        run: |
          curl -sSL -o sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz
          tar xzf sdl.tgz
          cmake -S SDL3-$SDL3_VERSION -B sdl-build -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=$HOME/sdl3
          cmake --build sdl-build -j"$(nproc)"
          cmake --install sdl-build

      - name: Build Previous
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$HOME/sdl3 -DBIN2DATADIR=. \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=ON -DCMAKE_DISABLE_FIND_PACKAGE_Readline=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_PCAP=ON
          cmake --build build -j"$(nproc)"
          ldd build/src/previous

      - name: Package
        run: |
          d=previous-linux-${{ matrix.arch }}
          mkdir $d
          cp build/src/previous build/src/ditool/ditool src/*.BIN $d/
          cp README.md gpl.txt readme.previous.txt *.howto.txt $d/
          tar czf $d.tar.gz $d

      - name: Smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          P=previous-linux-${{ matrix.arch }}/previous
          set +e
          $P --help >/dev/null; r=$?; echo "--help: $r"; [ $r -eq 1 ] || exit 1
          $P --dialogs off --sound off --timeout 5 >/dev/null 2>&1; r=$?; echo "--timeout: $r"; [ $r -eq 124 ] || exit 1
          (sleep 5; touch done) & $P --dialogs off --sound off --exit-when done --timeout 60 >/dev/null 2>&1; r=$?
          echo "--exit-when: $r"; [ $r -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v7
        with:
          path: previous-linux-${{ matrix.arch }}.tar.gz
          archive: false

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-zlib
            zip

      - name: Build Previous
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=ON -DCMAKE_DISABLE_FIND_PACKAGE_Readline=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_PCAP=ON
          cmake --build build

      - name: Package
        run: |
          d=previous-windows-x86_64
          mkdir $d
          cp build/src/previous.exe build/src/ditool/ditool.exe src/*.BIN $d/
          # the UCRT64 runtime / SDL3 DLLs the executables need
          for exe in $d/*.exe; do ldd "$exe"; done | awk '/\/ucrt64\// {print $3}' | sort -u | xargs -I{} cp {} $d/
          cp README.md gpl.txt readme.previous.txt *.howto.txt $d/
          ls $d
          zip -qr $d.zip $d

      - name: Smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          P=previous-windows-x86_64/previous.exe
          set +e
          # --dialogs off first: on Windows, exiting after --help would otherwise
          # wait for Enter in a newly opened console
          $P --dialogs off --help </dev/null >/dev/null 2>&1; r=$?; echo "--help: $r"; [ $r -eq 1 ] || exit 1
          $P --dialogs off --sound off --timeout 5 </dev/null >/dev/null 2>&1; r=$?; echo "--timeout: $r"; [ $r -eq 124 ] || exit 1
          (sleep 5; touch done) & $P --dialogs off --sound off --exit-when done --timeout 60 </dev/null >/dev/null 2>&1; r=$?
          echo "--exit-when: $r"; [ $r -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v7
        with:
          path: previous-windows-x86_64.zip
          archive: false

  # Collects the archives on every run (so a build-only run tests this too);
  # publishes only for a pushed tag or a manual run with release_tag.
  release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # keep the uploaded archives as they are (don't unpack the .zip files)
          skip-decompress: true

      - name: Check the archives
        run: |
          ls -la dist
          for f in previous-macos-universal.zip previous-linux-x86_64.tar.gz \
                   previous-linux-arm64.tar.gz previous-windows-x86_64.zip; do
            [ -f "dist/$f" ] || { echo "::error::missing archive: $f"; exit 1; }
          done
          [ "$(ls dist | wc -l)" -eq 4 ] || { echo "::error::unexpected files in dist"; exit 1; }
          unzip -tq dist/previous-macos-universal.zip
          unzip -tq dist/previous-windows-x86_64.zip
          for f in dist/*.tar.gz; do tar tzf "$f" >/dev/null; done
          echo "all 4 archives present and intact"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_NOTARIZED: ${{ needs.macos.outputs.notarized }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [ "$MAC_NOTARIZED" = true ] ||
            { echo "::error::the macOS app wasn't notarized - not publishing"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"; exit 1
          fi
          ls -la dist
          cat > notes.md <<'EOF'
          Previous with Hatari-style command line options, command FIFO and serial-port-to-host I/O
          for unattended runs. See `automation.howto.txt` in each archive.

          | Archive | Platform |
          |---|---|
          | `previous-macos-universal.zip` | macOS 10.13+, Apple Silicon and Intel (`Previous.app`) |
          | `previous-linux-x86_64.tar.gz` | Linux x86_64 (SDL3 built in) |
          | `previous-linux-arm64.tar.gz` | Linux arm64 (SDL3 built in) |
          | `previous-windows-x86_64.zip` | Windows x86_64 |

          The ROM images are included. These builds leave out libpng (screenshots are TIFF),
          readline and pcap (networking uses the built-in SLiRP).
          EOF
          echo "macOS: signed with a Developer ID and notarized by Apple." >> notes.md
          # creates the tag on this commit if it doesn't exist yet
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Previous $TAG" --notes-file notes.md
